# JURIKA — SonarQube project descriptor (Sprint 14 ter F3).
# Voir docs/v2/Guide_Tests_V1.md section SonarQube pour la procedure complete.

sonar.projectKey=jurika-platform
sonar.projectName=JURIKA Platform
sonar.projectVersion=1.0

# Sources (java + ts/tsx)
sonar.sources=backend-java/auth-service/src/main,\
              backend-java/dataroom-service/src/main,\
              backend-java/dashboard-service/src/main,\
              backend-java/discovery-service/src/main,\
              backend-java/gateway-service/src/main,\
              backend-java/jurika-common/src/main,\
              backend-java/supervision-service/src/main,\
              backend-java/ticket-service/src/main,\
              backend-java/workflow-service/src/main,\
              backend-java/ai-service/src/main,\
              frontend-react/src

sonar.tests=backend-java/auth-service/src/test,\
            backend-java/dataroom-service/src/test,\
            backend-java/dashboard-service/src/test,\
            backend-java/jurika-common/src/test,\
            backend-java/ticket-service/src/test,\
            backend-java/workflow-service/src/test,\
            backend-java/gateway-service/src/test,\
            frontend-react/src

sonar.test.inclusions=**/__tests__/**/*.{ts,tsx},**/*.{test,spec}.{ts,tsx}

# Java binaires (compile + JaCoCo)
sonar.java.binaries=backend-java/auth-service/target/classes,\
                    backend-java/dataroom-service/target/classes,\
                    backend-java/dashboard-service/target/classes,\
                    backend-java/discovery-service/target/classes,\
                    backend-java/gateway-service/target/classes,\
                    backend-java/jurika-common/target/classes,\
                    backend-java/supervision-service/target/classes,\
                    backend-java/ticket-service/target/classes,\
                    backend-java/workflow-service/target/classes,\
                    backend-java/ai-service/target/classes
sonar.java.test.binaries=backend-java/auth-service/target/test-classes,\
                         backend-java/dataroom-service/target/test-classes,\
                         backend-java/dashboard-service/target/test-classes,\
                         backend-java/jurika-common/target/test-classes
sonar.java.source=21

# Couverture
sonar.coverage.jacoco.xmlReportPaths=backend-java/auth-service/target/site/jacoco/jacoco.xml,\
                                     backend-java/dataroom-service/target/site/jacoco/jacoco.xml,\
                                     backend-java/dashboard-service/target/site/jacoco/jacoco.xml,\
                                     backend-java/jurika-common/target/site/jacoco/jacoco.xml,\
                                     backend-java/ticket-service/target/site/jacoco/jacoco.xml,\
                                     backend-java/workflow-service/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend-react/coverage/lcov.info

# Exclusions justifiees (DTOs, generated, configs Spring purs)
sonar.exclusions=**/dto/**,\
                 **/*Dtos.java,\
                 **/config/**Properties.java,\
                 **/target/**,\
                 frontend-react/dist/**,\
                 frontend-react/node_modules/**,\
                 frontend-react/test/**,\
                 **/maquettes/**,\
                 **/CODE_maquette_ts/**
sonar.coverage.exclusions=**/dto/**,\
                          **/*Dtos.java,\
                          **/*Application.java,\
                          **/config/**

sonar.sourceEncoding=UTF-8
