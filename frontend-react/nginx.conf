server {
    listen 80;
    # Ecoute AUSSI en IPv6. Dans l'image `nginx:alpine` actuelle, `localhost`
    # resout vers ::1 avant 127.0.0.1 : sans cette ligne, le HEALTHCHECK du
    # Dockerfile (`wget --spider http://localhost/`) recoit un refus de
    # connexion et le conteneur est declare unhealthy, alors que le site est
    # parfaitement servi en IPv4.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;

    # Lot L5b (E1, RG-COM-06) : service temps reel (messagerie, notifications) joint
    # par la MEME origine que le front, WebSocket compris : plus d'adresse ni de port a
    # configurer au build (le front visait http://localhost:3000, donc la machine de
    # chaque utilisateur). Resolution DNS de Docker a la requete : nginx demarre meme
    # si le service temps reel est momentanement absent.
    location /temps-reel/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $temps_reel http://realtime-service:3000;
        rewrite ^/temps-reel/(.*)$ /$1 break;
        proxy_pass $temps_reel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
