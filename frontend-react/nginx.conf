server {
    listen 80;
    # Ecoute AUSSI en IPv6. Dans l'image `nginx:alpine` actuelle, `localhost`
    # resout vers ::1 avant 127.0.0.1 : sans cette ligne, le HEALTHCHECK du
    # Dockerfile (`wget --spider http://localhost/`) recoit un refus de
    # connexion et le conteneur est declare unhealthy, alors que le site est
    # parfaitement servi en IPv4.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;
    gzip_min_length 1000;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
