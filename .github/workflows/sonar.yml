# JURIKA — SonarQube Quality Gate (Sprint 14 ter F3).
#
# Trigger : PR + push main.
# Quality Gate "JURIKA Strict" cote serveur Sonar :
#   - Coverage on New Code >= 80 %
#   - Duplicated Lines on New Code < 3 %
#   - Maintainability/Reliability/Security ratings <= A
#   - Security Hotspots reviewed = 100 %
#
# Secrets requis :
#   - SONAR_TOKEN     : token utilisateur Sonar (Repository Settings -> Secrets)
#   - SONAR_HOST_URL  : URL serveur Sonar (https://sonar.jurika.ma:9000 ou similaire)
#
# Status check obligatoire sur PR via GitHub branch protection (a configurer cote repo).

name: sonar

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  sonar:
    name: SonarQube Scan
    runs-on: ubuntu-22.04
    # Le contexte `secrets` n'est PAS disponible dans un `if` de job : la garde
    # d'origine rendait le workflow invalide (echec immediat). On expose le
    # booleen via `env` (autorise au niveau job) et on garde chaque step.
    env:
      SONAR_CONFIGURED: ${{ secrets.SONAR_TOKEN != '' && secrets.SONAR_HOST_URL != '' }}
    steps:
      - if: env.SONAR_CONFIGURED == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full clone pour blame Sonar

      - if: env.SONAR_CONFIGURED == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - if: env.SONAR_CONFIGURED == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - if: env.SONAR_CONFIGURED == 'true'
        name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - if: env.SONAR_CONFIGURED == 'true'
        name: Maven verify + JaCoCo
        working-directory: backend-java
        run: mvn -B -DskipITs verify

      - if: env.SONAR_CONFIGURED == 'true'
        name: Frontend coverage
        working-directory: frontend-react
        run: |
          npm ci --legacy-peer-deps
          npm run test:coverage

      - if: env.SONAR_CONFIGURED == 'true'
        name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: .

      - if: env.SONAR_CONFIGURED == 'true'
        name: Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
