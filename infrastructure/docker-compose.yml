services:
  # ══════════════════════════════════════════════════
  # POSTGRESQL 16 + pgvector
  # ══════════════════════════════════════════════════
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jurika-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jurika_db}
      POSTGRES_USER: ${POSTGRES_USER:-jurika_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-JurikaDevPass2026}
      # Passe a scripts/init-db.sh pour creer la BDD billing-service (Sprint 12)
      BILLING_DB_NAME: ${BILLING_DB_NAME:-jurika_billing}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jurika_user} -d ${POSTGRES_DB:-jurika_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jurika-network

  # ══════════════════════════════════════════════════
  # REDIS 7.4
  # ══════════════════════════════════════════════════
  redis:
    image: redis:7.4-alpine
    container_name: jurika-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-JurikaRedis2026}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-JurikaRedis2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jurika-network

  # ══════════════════════════════════════════════════
  # RABBITMQ 4.0 + Management UI
  # ══════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: jurika-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-jurika}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-JurikaRabbit2026}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-jurika}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - jurika-network

  # ══════════════════════════════════════════════════
  # MAILHOG (SMTP de dev : capture les emails localement)
  # SMTP port 1025 (sans auth ni STARTTLS), UI sur 8025
  #
  # Fix 2026-06-07 : profil "mailhog" => ne demarre PAS par defaut.
  # En dev contre Brevo : laisser tel quel, MailHog n'occupera plus le port
  # 1025 et auth-service tapera direct sur smtp-relay.brevo.com.
  # Pour ressusciter MailHog : docker compose --profile mailhog up -d mailhog
  # ══════════════════════════════════════════════════
  mailhog:
    image: mailhog/mailhog:latest
    container_name: jurika-mailhog
    restart: unless-stopped
    profiles: ["mailhog"]
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - jurika-network

  # ══════════════════════════════════════════════════
  # MINIO (S3-compatible Object Storage)
  # ══════════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: jurika-minio
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jurika-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-JurikaMinIO2026}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - jurika-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local

networks:
  jurika-network:
    driver: bridge
    name: jurika-network
