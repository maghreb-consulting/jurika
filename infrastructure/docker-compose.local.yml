# JURIKA — Compose overlay LOCAL SERVER (Sprint Beta pricing-deploy TASK 8)
#
# Ce fichier complete les 2 compose existants (infra + 7 services Sprint 2)
# pour livrer la stack DEMO complete sur un SERVEUR LOCAL accessible LAN :
#
#   - billing-service (port 8090, Sprint 12, manquait du services.yml)
#   - dashboard-service (port 8087, Sprint 10, manquait du services.yml)
#   - frontend-react (nginx-spa port 80, build Vite servi statique)
#   - marketing-site (nginx port 8090, optionnel — sur le meme host
#                     que app, accessible via routing reverse-proxy)
#
# Tous les ports sont bindes sur 0.0.0.0 (defaut Docker) -> accessibles
# depuis n'importe quelle IP LAN.
#
# Usage :
#   docker compose \
#     -f infrastructure/docker-compose.yml \
#     -f infrastructure/docker-compose.services.yml \
#     -f infrastructure/docker-compose.local.yml \
#     --env-file .env.local \
#     up -d
#
# Ou plus simplement : scripts/start-local.ps1 (Windows) / start-local.sh (Linux/Mac)
#
# Pre-requis :
#   - .env.local.server (depuis .env.local.server.example) avec :
#       * JURIKA_LAN_HOST       = ex 192.168.1.42 ou demo.jurika.local
#       * STRIPE_SECRET_KEY     = sk_test_* (et 4 STRIPE_PRICE_*_*)
#       * BREVO_SMTP_USER       = compte Brevo (fallback MailHog si vide)
#       * BREVO_SMTP_PASSWORD
#       * JWT_PRIVATE_KEY_PATH  = chemin vers le PEM (genere par
#         openssl si premiere fois — voir DEPLOY_LOCAL.md §4)

services:
  # ──────────────────────────────────────────────────────────────────
  # BILLING-SERVICE (Sprint 12, port 8090, DB jurika_billing)
  # ──────────────────────────────────────────────────────────────────
  billing-service:
    build:
      context: ../backend-java
      dockerfile: billing-service/Dockerfile
    container_name: jurika-billing
    restart: unless-stopped
    ports:
      # Lot L0 (E16e) : publie sur 127.0.0.1 seulement (IPv4), plus sur le LAN.
      # Les clients Node qui resolvent `localhost` en ::1 d abord (fetch de
      # Node >=17) visent donc 127.0.0.1 explicitement (smoke-test.mjs).
      - "127.0.0.1:${BILLING_SERVICE_PORT:-8090}:8090"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod-local}
      JURIKA_ENV: ${JURIKA_ENV:-local}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      BILLING_DB_NAME: ${BILLING_DB_NAME:-jurika_billing}
      POSTGRES_USER: ${POSTGRES_USER:-jurika_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      # Lot L0 (CI base-vierge) : memes expressions que le conteneur rabbitmq
      # (sinon repli code en dur d'application.yml, faux sur une base neuve).
      RABBITMQ_USER: ${RABBITMQ_USER:-jurika}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-JurikaRabbit2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
      # Stripe (les 4 price IDs sont injectes depuis .env.local par compose).
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_STARTER_MONTHLY: ${STRIPE_PRICE_STARTER_MONTHLY}
      STRIPE_PRICE_STARTER_YEARLY:  ${STRIPE_PRICE_STARTER_YEARLY}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${STRIPE_PRICE_BUSINESS_MONTHLY}
      STRIPE_PRICE_BUSINESS_YEARLY:  ${STRIPE_PRICE_BUSINESS_YEARLY}
      # URLs retour Stripe Checkout (publique LAN — d'ou le LAN_HOST)
      BILLING_CHECKOUT_SUCCESS_URL: ${BILLING_CHECKOUT_SUCCESS_URL:-http://${JURIKA_LAN_HOST:-localhost}/billing/success?session_id={CHECKOUT_SESSION_ID}}
      BILLING_CHECKOUT_CANCEL_URL: ${BILLING_CHECKOUT_CANCEL_URL:-http://${JURIKA_LAN_HOST:-localhost}/billing}
      BILLING_PORTAL_RETURN_URL:   ${BILLING_PORTAL_RETURN_URL:-http://${JURIKA_LAN_HOST:-localhost}/billing}
      # SMTP : Brevo (prod) ou MailHog (fallback)
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_FROM: ${SMTP_FROM:-noreply@jurika.ma}
      # Plan limits enforcement (T3) actif par defaut en demo.
      JURIKA_PLAN_LIMITS_ENABLED: "true"
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      discovery-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8090/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - jurika-network

  # ──────────────────────────────────────────────────────────────────
  # DASHBOARD-SERVICE (Sprint 10, port 8087)
  # ──────────────────────────────────────────────────────────────────
  dashboard-service:
    build:
      context: ../backend-java
      dockerfile: dashboard-service/Dockerfile
    container_name: jurika-dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DASHBOARD_SERVICE_PORT:-8087}:8087"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod-local}
      JURIKA_ENV: ${JURIKA_ENV:-local}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      # Lot L0 (CI base-vierge) : memes expressions que le conteneur rabbitmq
      # (sinon repli code en dur d'application.yml, faux sur une base neuve).
      RABBITMQ_USER: ${RABBITMQ_USER:-jurika}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-JurikaRabbit2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
      JURIKA_PLAN_LIMITS_ENABLED: "true"
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      discovery-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8087/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - jurika-network

  # ──────────────────────────────────────────────────────────────────
  # REALTIME-SERVICE (Node.js — Socket.io + chat + notifications)
  # Port 3000. Sert le WebSocket pour le frontend (cf VITE_REALTIME_URL).
  # ──────────────────────────────────────────────────────────────────
  realtime-service:
    build:
      context: ../backend-node
      dockerfile: Dockerfile
    container_name: jurika-realtime
    restart: unless-stopped
    ports:
      - "${REALTIME_SERVICE_PORT:-3000}:3000"
    environment:
      PORT: 3000
      # JWT — utilise la cle publique RS256 partagee avec les services Java.
      JWT_ALGORITHM: ${JWT_ALGORITHM:-RS256}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
      # PostgreSQL — meme DB que les services Java (notifications + chat).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-jurika_db}
      POSTGRES_USER: ${POSTGRES_USER:-jurika_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis (mot de passe requis cf docker-compose.yml requirepass).
      REDIS_URL: ${REDIS_URL:-redis://default:${REDIS_PASSWORD}@redis:6379}
      # Token partage pour les ingestion serveur-a-serveur (auth-service -> realtime).
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      # CORS : frontend nginx LAN + dev local.
      CORS_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://${JURIKA_LAN_HOST:-localhost},http://${JURIKA_LAN_HOST:-localhost}:80,http://localhost:5173}
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - jurika-network

  # ──────────────────────────────────────────────────────────────────
  # FRONTEND-REACT (Vite build statique servi par nginx)
  # ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend-react
      dockerfile: Dockerfile
      # Vite resout import.meta.env.VITE_* a la compilation -> args build.
      args:
        VITE_API_URL: ${VITE_API_URL:-http://${JURIKA_LAN_HOST:-localhost}:8080/api/v1}
        VITE_REALTIME_URL: ${VITE_REALTIME_URL:-http://${JURIKA_LAN_HOST:-localhost}:3000}
    container_name: jurika-frontend
    restart: unless-stopped
    ports:
      # Port 80 sur le LAN. Reverse-proxy peut le re-router via 443
      # via Traefik en prod (cf deployment/docker-compose.staging.yml).
      - "${FRONTEND_PORT:-80}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://${JURIKA_LAN_HOST:-localhost}:8080/api/v1}
      VITE_REALTIME_URL: ${VITE_REALTIME_URL:-http://${JURIKA_LAN_HOST:-localhost}:3000}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      gateway-service: { condition: service_healthy }
      realtime-service: { condition: service_healthy }
    healthcheck:
      # 127.0.0.1 et non `localhost` : la conf nginx du projet ne declare que
      # `listen 80;` (IPv4). Le script 10-listen-on-ipv6-by-default.sh de
      # l'image ne l'ajoute pas car default.conf differe de la version packagee.
      # wget resolvait donc `localhost` en [::1] -> "Connection refused" et le
      # conteneur restait `unhealthy` alors que nginx servait bien l'appli, ce
      # qui bloquait tout `depends_on: service_healthy` sur le frontend.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - jurika-network

# Le reseau et les volumes sont declares dans docker-compose.yml (infra base).
# Ce overlay n'a qu'a referencer le network existant.
networks:
  jurika-network:
    external: false
