upstream java_gateway {
    server gateway-service:8080;
}

upstream node_realtime {
    server realtime-service:3000;
}

# ─────────────────────────────────────────────────────
# HTTP : redirige tout vers HTTPS (sauf health check Docker)
# ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────
# HTTPS : TLS 1.2/1.3, OWASP headers, SPA + API + WS
# Cert dev local : mkcert (./secrets/tls/jurika-local.pem)
# Cert prod      : Let's Encrypt (cf. production/letsencrypt.md)
# ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/jurika-local.pem;
    ssl_certificate_key /etc/nginx/tls/jurika-local-key.pem;

    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling (utile en prod Let's Encrypt — inoffensif en dev mkcert)
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=60s;
    resolver_timeout 5s;

    # Security headers (OWASP). Voir aussi SecurityHeadersFilter (gateway).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Frontend React (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Java API Gateway
    location /api/ {
        proxy_pass http://java_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        client_max_body_size 50M;
    }

    # WebSocket (Node.js realtime)
    location /socket.io/ {
        proxy_pass http://node_realtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
    }
}
