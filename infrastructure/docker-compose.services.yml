# JURIKA — Compose des 7 services Java + Node realtime (Sprint 2 / TASK 7).
#
# Ce fichier est versionne pour preparer le deploiement Sprint 15 (K8s). Il complete
# infrastructure/docker-compose.yml (PG/Redis/Rabbit/MinIO/Mailhog) et s'attend a un
# Dockerfile par service (a livrer Sprint 15).
#
# Healthcheck : interroge /actuator/health/readiness. Le service est marque healthy
# uniquement quand toutes ses dependances (db, rabbit, minio, redis) sont UP.
#
# Usage :
#   docker compose -f infrastructure/docker-compose.yml \
#                  -f infrastructure/docker-compose.services.yml up -d

# YAML anchor : ENV OTel partagee par tous les services Java (Sprint 2 / TASK 3).
# Le nom du service est surcharge dans chaque bloc via OTEL_SERVICE_NAME.
x-otel-environment: &otel-env
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none
  OTEL_LOGS_EXPORTER: none
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
  OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
  OTEL_PROPAGATORS: tracecontext,baggage,b3
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${JURIKA_ENV:-dev}

services:
  # ──────────────────────────────────────────────────────────────────
  # JAVA SERVICES
  # ──────────────────────────────────────────────────────────────────
  discovery-service:
    build:
      context: ../backend-java
      dockerfile: discovery-service/Dockerfile
    container_name: jurika-discovery
    restart: unless-stopped
    ports:
      - "${DISCOVERY_PORT:-8761}:8761"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: discovery-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JURIKA_ENV: ${JURIKA_ENV:-dev}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8761/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - jurika-network

  gateway-service:
    build:
      context: ../backend-java
      dockerfile: gateway-service/Dockerfile
    container_name: jurika-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: gateway-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JURIKA_ENV: ${JURIKA_ENV:-dev}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      # Amorce de la liste blanche CORS au demarrage. Elle est ensuite REMPLACEE
      # toutes les 5 min par la liste venue de la base
      # (auth-service /api/v1/admin/cors-origins, cf. DynamicCorsConfigurationSource) :
      # la base reste la source durable. Cette valeur ne couvre que la fenetre
      # entre le demarrage et le premier sondage -- sans elle, les requetes de la
      # page servie par le conteneur (http://localhost, port 80) sont refusees en
      # 403 pendant ce laps de temps.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-JurikaRedis2026}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      discovery-service: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - jurika-network

  auth-service:
    build:
      context: ../backend-java
      dockerfile: auth-service/Dockerfile
    container_name: jurika-auth
    restart: unless-stopped
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:8081"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: auth-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JURIKA_ENV: ${JURIKA_ENV:-dev}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-JurikaRedis2026}
      RABBITMQ_HOST: rabbitmq
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/jwt-private-pkcs8.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
      # Cle AES qui chiffre les secrets TOTP en base. SANS cette ligne, le
      # conteneur retombait sur la valeur de repli d'application.yml
      # (`dev-only-aes-secret-...`), differente de celle du mode hote qui a
      # chiffre les secrets deja en base : /verify-2fa repondait 500 avec
      # `AEADBadTagException: Tag mismatch`, et la 2FA etait infranchissable.
      # `:?` fait echouer Compose bruyamment plutot que de repartir en silence
      # sur une mauvaise cle -- une divergence de cle ne doit jamais etre muette.
      AES_SECRET_KEY: "${AES_SECRET_KEY:?AES_SECRET_KEY absent, .env doit etre passe en --env-file}"
      # Lot L0 (E13c) : role d'execution jurika_app (la RLS s'applique). Mot de
      # passe dedie, obligatoire : Compose echoue bruyamment s'il manque.
      JURIKA_APP_PASSWORD: "${JURIKA_APP_PASSWORD:?JURIKA_APP_PASSWORD absent, .env.local doit le definir}"
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      discovery-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - jurika-network

  ticket-service:
    build:
      context: ../backend-java
      dockerfile: ticket-service/Dockerfile
    container_name: jurika-ticket
    restart: unless-stopped
    ports:
      - "${TICKET_SERVICE_PORT:-8082}:8082"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ticket-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JURIKA_ENV: ${JURIKA_ENV:-dev}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
      # Lot L0 (E14b) : role d'execution jurika_app (la RLS s'applique). Mot de
      # passe dedie, obligatoire : Compose echoue bruyamment s'il manque.
      JURIKA_APP_PASSWORD: "${JURIKA_APP_PASSWORD:?JURIKA_APP_PASSWORD absent, .env.local doit le definir}"
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      discovery-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      # auth-service cree le schema racine partage (workspaces/users) dans jurika_db :
      # ticket-service le reference et doit donc migrer apres lui.
      auth-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - jurika-network

  workflow-service:
    build:
      context: ../backend-java
      dockerfile: workflow-service/Dockerfile
    container_name: jurika-workflow
    restart: unless-stopped
    ports:
      - "${WORKFLOW_SERVICE_PORT:-8083}:8083"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: workflow-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JURIKA_ENV: ${JURIKA_ENV:-dev}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
      # Lot L0 (E16) : role d'execution jurika_app (la RLS s'applique). Mot de
      # passe dedie, obligatoire : Compose echoue bruyamment s'il manque.
      JURIKA_APP_PASSWORD: "${JURIKA_APP_PASSWORD:?JURIKA_APP_PASSWORD absent, .env.local doit le definir}"
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      discovery-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      # auth-service cree le schema racine partage (workspaces) dans jurika_db :
      # workflow-service le reference et doit donc migrer apres lui.
      auth-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - jurika-network

  dataroom-service:
    build:
      context: ../backend-java
      dockerfile: dataroom-service/Dockerfile
    container_name: jurika-dataroom
    restart: unless-stopped
    ports:
      - "${DATAROOM_SERVICE_PORT:-8084}:8084"
    environment:
      # Edition bureautique (lot 3) — cf. commentaires dans application.yml.
      WOPI_BASE_URL: ${WOPI_BASE_URL:-http://dataroom-service:8084}
      WOPI_EDITOR_URL: ${WOPI_EDITOR_URL:-http://localhost:9980}
      WOPI_SESSION_DURATION: ${WOPI_SESSION_DURATION:-PT2H}
      WOPI_GRACE_WINDOW: ${WOPI_GRACE_WINDOW:-PT3M}
      <<: *otel-env
      OTEL_SERVICE_NAME: dataroom-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JURIKA_ENV: ${JURIKA_ENV:-dev}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      POSTGRES_HOST: postgres
      RABBITMQ_HOST: rabbitmq
      MINIO_ENDPOINT: http://minio:9000
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
      # Lot L0 (E15b) : role d'execution jurika_app (la RLS s'applique). Mot de
      # passe dedie, obligatoire : Compose echoue bruyamment s'il manque.
      JURIKA_APP_PASSWORD: "${JURIKA_APP_PASSWORD:?JURIKA_APP_PASSWORD absent, .env.local doit le definir}"
      # Microservice kie-service (Donut KIE pour CIN / CN).
      KIE_BASE_URL: ${KIE_BASE_URL:-http://kie-service:8088}
      KIE_TIMEOUT: ${KIE_TIMEOUT:-30s}
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      discovery-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      # kie-service est optionnel — l'extraction d'identité tombe en 503 si absent
      # (le reste de la Data Room continue de fonctionner).
      kie-service: { condition: service_started }
      # auth-service cree le schema racine partage (workspaces) dans jurika_db :
      # dataroom-service le reference et doit donc migrer apres lui.
      auth-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - jurika-network

  ai-service:
    build:
      context: ../backend-java
      dockerfile: ai-service/Dockerfile
    container_name: jurika-ai
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8085}:8085"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: ai-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JURIKA_ENV: ${JURIKA_ENV:-dev}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      POSTGRES_HOST: postgres
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
      # Voie OCR rapide CPU (2026-06-09 — branche feat/ocr-paddle-cpu).
      OCR_FAST_ENABLED: ${OCR_FAST_ENABLED:-true}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr-service:8089}
      OCR_FAST_TIMEOUT: ${OCR_FAST_TIMEOUT:-30}
      OCR_FAST_LANG: ${OCR_FAST_LANG:-latin}
      # RAG chatbot (Gemini gratuit) — 2026-07-01. Cle vide = RAG desactive (FTS + KB), pas de casse.
      RAG_ENABLED: ${RAG_ENABLED:-false}
      RAG_CHAT_BASE_URL: ${RAG_CHAT_BASE_URL:-}
      RAG_CHAT_API_KEY: ${RAG_CHAT_API_KEY:-}
      RAG_CHAT_MODEL: ${RAG_CHAT_MODEL:-gemini-1.5-flash}
      RAG_EMBED_BASE_URL: ${RAG_EMBED_BASE_URL:-}
      RAG_EMBED_API_KEY: ${RAG_EMBED_API_KEY:-}
      RAG_EMBED_MODEL: ${RAG_EMBED_MODEL:-text-embedding-004}
      RAG_EMBED_DIMENSIONS: ${RAG_EMBED_DIMENSIONS:-768}
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      discovery-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      # ocr-service est optionnel — l'ai-service tolère son absence (fallback vision/manuel).
      # On le déclare en condition: started pour ne pas bloquer le boot si l'OCR met du
      # temps à charger les modèles ; le HealthCache côté Java gère la transition.
      ocr-service: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8085/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - jurika-network

  # ──────────────────────────────────────────────────────────────────
  # OCR SERVICE (Python, CPU only) — 2026-06-09 branche feat/ocr-paddle-cpu
  # Voie texte rapide pour les images / scans (CIN, CN, RC). Remplace
  # avantageusement le LLM vision qwen3-vl en CPU (100-120s -> 1-3s).
  # ──────────────────────────────────────────────────────────────────
  ocr-service:
    build:
      context: ../backend-python/ocr-service
      dockerfile: Dockerfile
    container_name: jurika-ocr
    restart: unless-stopped
    ports:
      - "${OCR_PORT:-8089}:8089"
    environment:
      OCR_ENGINE: ${OCR_ENGINE:-doctr}
      OCR_DEFAULT_LANG: ${OCR_DEFAULT_LANG:-latin}
      OCR_MAX_WIDTH: ${OCR_MAX_WIDTH:-1600}
      OCR_PRELOAD: ${OCR_PRELOAD:-true}
      OCR_LOG_LEVEL: ${OCR_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8089/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Premier boot : DL des poids docTR (~200 MB) puis warmup torch.
      start_period: 180s
    networks:
      - jurika-network

  # ──────────────────────────────────────────────────────────────────
  # KIE SERVICE (Python, CPU only) — branche feat/kie-service-ocr
  # Donut KIE (VisionEncoderDecoderModel) pour extraire les champs
  # structurés d'une CIN ou CN marocaine. Poids montés en volume
  # read-only ; jamais embarqués dans l'image.
  # ──────────────────────────────────────────────────────────────────
  kie-service:
    build:
      context: ../backend-python/kie-service
      dockerfile: Dockerfile
    container_name: jurika-kie
    restart: unless-stopped
    ports:
      - "${KIE_PORT:-8088}:8088"
    environment:
      DONUT_MODEL_DIR: ${DONUT_MODEL_DIR:-/models/donut-jurika-final}
      MAX_FILE_MB: ${KIE_MAX_FILE_MB:-15}
      KIE_PRELOAD: ${KIE_PRELOAD:-true}
      KIE_LOG_LEVEL: ${KIE_LOG_LEVEL:-INFO}
    volumes:
      # Le répertoire host doit contenir les poids déjà entraînés
      # (config.json + model.safetensors + tokenizer*). Le path est relatif
      # à ce fichier compose (infrastructure/), donc ../models/ pointe vers
      # projet/models/. Surchargeable via DONUT_MODEL_DIR_HOST en absolu.
      - ${DONUT_MODEL_DIR_HOST:-../models/donut-jurika-final}:/models/donut-jurika-final:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Premier boot : chargement Donut sur CPU (~30-60s host).
      start_period: 180s
    networks:
      - jurika-network

  supervision-service:
    build:
      context: ../backend-java
      dockerfile: supervision-service/Dockerfile
    container_name: jurika-supervision
    restart: unless-stopped
    ports:
      - "${SUPERVISION_SERVICE_PORT:-8086}:8086"
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: supervision-service
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      JURIKA_ENV: ${JURIKA_ENV:-dev}
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-JurikaRedis2026}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    depends_on:
      discovery-service: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8086/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - jurika-network

  # ──────────────────────────────────────────────────────────────────
  # COLLABORA ONLINE CODE (lot 3) — édition bureautique fidèle
  #
  # Pourquoi ce conteneur : l'aller-retour .docx → HTML → .docx de l'éditeur
  # TipTap détruit la mise en page du directeur. Mesuré au lot 2 sur un même
  # acte : styles.xml absent, 49 paragraphes stylés `JurikaTitreArticle` → 0,
  # 11 numérotations automatiques → 0, 89 alignements → 0. Aucun format
  # intermédiaire ne préserve cela ; il faut un moteur bureautique réel.
  #
  # Licence MPL-2.0, gratuit, sans limite d'utilisateurs. ONLYOFFICE est écarté
  # (AGPL v3, incompatible avec une diffusion SaaS sans publication du code).
  #
  # RÉSERVE PORTÉE AU DOSSIER : l'éditeur déclare CODE « non recommandé en
  # production » (publication continue, sans SLA). Acceptable pour un usage
  # interne au cabinet ; à réévaluer avant commercialisation.
  # ──────────────────────────────────────────────────────────────────
  collabora:
    image: collabora/code:latest
    container_name: jurika-collabora
    restart: unless-stopped
    ports:
      - "${COLLABORA_PORT:-9980}:9980"
    environment:
      # aliasgroup1 — LA cause d'échec n° 1 de cette intégration
      # (« Unauthorized WOPI host »). Collabora valide l'hôte du paramètre
      # `WOPISrc` contre cette liste. Le premier élément est l'hôte WOPI
      # principal, les suivants en sont des alias.
      #
      # Ici `WOPISrc` désigne le backend par son nom de service Docker : c'est
      # Collabora qui appelle le backend, jamais le navigateur. On déclare
      # néanmoins aussi l'origine publique, pour qu'une configuration passant
      # par la passerelle continue de fonctionner sans re-toucher ce fichier.
      aliasgroup1: ${COLLABORA_ALIASGROUP:-http://dataroom-service:8084,http://gateway-service:8080,http://localhost:8084,http://localhost}
      # Console d'administration — jamais en clair ici, cf. .env.local.
      username: ${COLLABORA_ADMIN_USER:-}
      password: ${COLLABORA_ADMIN_PASSWORD:-}
      DONT_GEN_SSL_CERT: "true"
      # TLS — POINT OUVERT DE L'AUDIT DE SÉCURITÉ, à revoir le jour où HTTPS
      # sera déployé.
      #   ssl.enable=false      : pas de TLS interne au conteneur.
      #   ssl.termination=FALSE : aujourd'hui RIEN ne termine le TLS en amont —
      #     le navigateur appelle http://localhost:9980 en clair. Mettre `true`
      #     ici fait annoncer par /hosting/discovery des URL en `https://`
      #     (mesuré : 278 urlsrc en https), que le navigateur ne peut pas
      #     joindre puisque le conteneur n'écoute qu'en HTTP : l'éditeur ne
      #     s'ouvre jamais. Le jour où un reverse proxy terminera TLS devant
      #     Collabora, passer COLLABORA_SSL_TERMINATION à `true` — et alors
      #     seulement.
      extra_params: >-
        --o:ssl.enable=false
        --o:ssl.termination=${COLLABORA_SSL_TERMINATION:-false}
        --o:num_prespawn_children=1
        --o:net.frame_ancestors=${COLLABORA_FRAME_ANCESTORS:-http://localhost http://localhost:80}
        --o:logging.level=warning
    # Voie A (arbitrage 2026-09-07) : la VM Docker n'a que ~2,4 Go de marge pour
    # 18 conteneurs. Un seul processus de rendu pré-alloué au lieu de quatre, et
    # un plafond mémoire explicite — mieux vaut une file d'attente qu'un OOM
    # killer qui choisit sa victime parmi les autres services.
    mem_limit: ${COLLABORA_MEM_LIMIT:-1g}
    cap_add:
      - MKNOD
    # PAS DE `healthcheck:` ICI, ET C'EST VOULU.
    #
    # L'image embarque le sien : `/usr/bin/coolwsd --probe --use-env-vars`,
    # exécuté SANS interpréteur. Le conteneur n'a ni `/bin/sh` ni coreutils —
    # `docker exec jurika-collabora ls` échoue par « executable file not found ».
    # Toute sonde écrite en `CMD-SHELL` (un `curl` sur /hosting/discovery, par
    # exemple) échoue donc systématiquement, et le conteneur reste marqué
    # `unhealthy` alors que le service répond parfaitement — mesuré : 200 depuis
    # l'hôte comme depuis `dataroom-service`. Un `unhealthy` permanent est pire
    # qu'une absence de sonde : il use le seul signal qui devrait alerter.
    #
    # Laisser l'image faire évite aussi de figer un chemin de binaire qui
    # changerait à la prochaine publication de CODE.
    networks:
      - jurika-network

networks:
  jurika-network:
    external: true
    name: jurika-network
