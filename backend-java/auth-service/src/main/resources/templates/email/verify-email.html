<!DOCTYPE html>
<!-- Recette R3 : mise en page commune (jurika-common, templates/email/_mise-en-page.html). -->
<html xmlns:th="http://www.thymeleaf.org" lang="fr"
      th:replace="~{email/_mise-en-page :: courriel(titre='Nouveau lien de v&eacute;rification', corps=~{::corps}, pied=~{::pied})}">
<body>
<table>
<th:block th:fragment="corps">
    <tr>
        <td style="padding:32px;">
            <p style="margin:0 0 16px;font-size:15px;line-height:1.55;">
                Bonjour <strong th:text="${firstName}">Karim</strong>,
            </p>

            <p style="margin:0 0 24px;font-size:15px;line-height:1.55;">
                Vous avez demand&eacute; un nouveau lien de v&eacute;rification pour activer votre
                compte JURIKA.
            </p>

            <div style="text-align:center;margin:32px 0;">
                <a th:href="${verificationUrl}"
                   style="display:inline-block;background:#0c1d3f;color:#c9a24a;text-decoration:none;padding:14px 32px;border-radius:8px;font-weight:600;font-size:15px;">
                    Activer mon compte
                </a>
            </div>

            <p style="margin:0 0 16px;font-size:13px;color:#64748B;line-height:1.55;">
                Ce lien expire dans <strong>24 heures</strong>. Au besoin, vous pourrez en demander
                un autre depuis la page de connexion.
            </p>

            <th:block th:replace="~{email/_base :: phishingBox}"/>

            <div style="border-top:1px solid #E2E8F0;margin:24px 0 0;padding-top:24px;">
                <p style="margin:0;font-size:12px;color:#5b6474;line-height:1.55;">
                    Si vous n&rsquo;avez pas demand&eacute; ce lien, ignorez simplement ce courriel.
                </p>
            </div>
        </td>
    </tr>
</th:block>
<th:block th:fragment="pied">
    <th:block th:replace="~{email/_base :: identityFooter(loginEmail=${loginEmail}, contactEmail=${contactEmail})}"/>
    <th:block th:replace="~{email/_base :: footer(unsubscribeUrl=${unsubscribeUrl})}"/>
</th:block>
</table>
</body>
</html>
