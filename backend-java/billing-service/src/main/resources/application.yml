server:
  port: ${BILLING_SERVICE_PORT:8090}
  shutdown: graceful

spring:
  application:
    name: billing-service
  lifecycle:
    timeout-per-shutdown-phase: 30s

  # Sprint 12 — base PG dediee jurika_billing (decision archi #4 : isolation
  # financiere + audit + conformite PCI/PSD2). A creer dans Postgres :
  #   CREATE DATABASE jurika_billing OWNER jurika_user;
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${BILLING_DB_NAME:jurika_billing}
    username: ${POSTGRES_USER:jurika_user}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    table: flyway_history_billing
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing,*:future"

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

# Sprint 1 — verification JWT RS256 via cle publique partagee
jurika:
  jwt:
    algorithm: ${JWT_ALGORITHM:RS256}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/jwt-public.pem}
    hmac-secret: ${JWT_SECRET:}

  # BUG 14 (2026-06-09) fix — URL directe auth-service pour le Feign client
  # WorkspaceStatusFeignClient. Sans cette property explicite le defaut etait
  # "http://auth-service" qui ne resout QUE via Eureka — donc en local sans
  # discovery, Feign throwait et issue-credentials retombait dans le vide.
  # En docker compose / k8s : override avec http://auth-service:8081.
  auth:
    internal-url: ${JURIKA_AUTH_INTERNAL_URL:http://localhost:8081}

  # Lot L7 (E6) : contrat d'abonnement. Identite du cabinet et du signataire lue chez
  # auth-service avec le jeton du superviseur (nom du service sur le reseau Docker).
  contrat:
    auth-url: ${JURIKA_CONTRAT_AUTH_URL:http://auth-service:8081}

  billing:
    # Lot L7 : destinataire des demandes de devis ; vide = adresse d'expedition (SMTP_FROM).
    sales-email: ${BILLING_SALES_EMAIL:}
    from-email: ${SMTP_FROM:}
    # Recette R3 : nom affiche de l'expediteur (comme auth-service).
    from-name: ${SMTP_FROM_NAME:JURIKA}
    # Lot L7 (E5) : adresse publique du front (retour du navigateur apres la page du CMI).
    front-url: ${FRONTEND_URL:http://localhost:5173}
    # A_DECIDER (direction) : banque et RIB de l'editeur pour le virement ; vides tant que non
    # communiques (l'ecran le dit, aucune coordonnee inventee).
    virement-banque: ${JURIKA_VIREMENT_BANQUE:}
    virement-rib: ${JURIKA_VIREMENT_RIB:}

  # Lot L7 (E5), RG-PAY-04 : magasin chez le CMI. AUCUNE valeur par defaut : sans ces variables, le
  # paiement par carte est refuse avec un message qui le dit. CMI_STORE_KEY est un secret.
  cmi:
    client-id: ${CMI_CLIENT_ID:}
    store-key: ${CMI_STORE_KEY:}
    gateway-url: ${CMI_GATEWAY_URL:}
    callback-url: ${CMI_CALLBACK_URL:}
    ok-url: ${CMI_OK_URL:}
    fail-url: ${CMI_FAIL_URL:}
    lang: fr
    # Simulateur de test (jamais en production : refuse au demarrage si JURIKA_ENV=prod).
    simulateur-actif: ${CMI_SIMULATEUR_ACTIF:false}

  env: ${JURIKA_ENV:local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    # Le HealthIndicator mail rend /actuator/health 503 si le SMTP externe (Brevo) tombe :
    # cf. auth-service application.yml pour la rationale (alignement cross-service).
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ma.jurika.billing: INFO
