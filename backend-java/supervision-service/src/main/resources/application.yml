server:
  port: ${SUPERVISION_SERVICE_PORT:8086}
  shutdown: graceful
spring:
  application:
    name: supervision-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:jurika_db}
    username: ${POSTGRES_USER:jurika_user}
    password: ${POSTGRES_PASSWORD:JurikaDevPass2026}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_history_supervision
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

jurika:
  jwt:
    algorithm: ${JWT_ALGORITHM:RS256}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:/run/secrets/jwt/jwt-public.pem}
    hmac-secret: ${JWT_SECRET:dev-only-jwt-secret-min-32-chars-not-for-prod-CHANGE-ME-12345}
    issuer: ${JWT_ISSUER:jurika.ma}
  env: ${JURIKA_ENV:dev}
  release: ${JURIKA_RELEASE:dev}
  observability:
    prometheus:
      password: ${PROMETHEUS_OPS_PASSWORD:}

sentry:
  dsn: ${SENTRY_DSN_JAVA:}
  enabled: ${SENTRY_ENABLED:false}
  environment: ${jurika.env:dev}
  release: ${jurika.release:dev}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false
  exception-resolver-order: -2147483647
  in-app-includes:
    - ma.jurika

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${jurika.env:dev}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    ma.jurika: INFO
