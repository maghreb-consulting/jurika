# Server
server.port=8080
spring.application.name=gje-platform

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/gje_db
spring.datasource.username=gje_user
spring.datasource.password=Gje2026Secure!
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair=true

# JWT
jwt.secret=GjeJwtSecretKey2026MaghrebConsultingSecure32Chars
jwt.expiration=90000000
jwt.refresh-expiration=86400000
jwt.temp-expiration=300000

# Mail SendGrid
spring.mail.host=smtp.sendgrid.net
spring.mail.port=587
spring.mail.username=apikey
spring.mail.password=SG.your_sendgrid_key_here
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false


# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS
cors.allowed-origins=http://localhost:3001,http://localhost:3000

# Logging
logging.level.fr.maghreb.gje=DEBUG
logging.level.org.springframework.security=DEBUG


