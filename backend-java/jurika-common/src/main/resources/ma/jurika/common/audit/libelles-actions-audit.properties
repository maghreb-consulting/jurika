# Libelles francais des codes d'action du journal d'audit (table audit_log).
# Source UNIQUE : lue par jurika-common (AuditActionLabels), donc par la tracabilite du
# cabinet (dashboard), le journal d'audit du super-admin et la fiche d'un cabinet (auth),
# et par la simulation visuelle du front (frontend-react/e2e/visuel/simulation).
# Fichier ASCII : accents en echappements \uXXXX (format java.util.Properties).
# Un code emis sans libelle ici fait echouer AuditActionLabelsInventaireTest.
# Les echecs d'une methode @Auditable (CODE_FAILED, ecrits par AuditAspect) n'ont pas de
# ligne : leur libelle est derive de celui de CODE.

