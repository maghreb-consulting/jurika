server:
  port: ${TICKET_SERVICE_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: ticket-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:jurika_db}
    # Lot L0 (E14b) : role d'execution jurika_app (non proprietaire,
    # NOSUPERUSER, NOBYPASSRLS) pour que la RLS s'applique. Mot de passe DEDIE
    # et OBLIGATOIRE, sans valeur de repli. Flyway migre avec le proprietaire.
    username: ${JURIKA_APP_DB_USER:jurika_app}
    password: ${JURIKA_APP_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: true
    table: flyway_history_ticket
    # Lot L0 (E14b) : DDL, politiques et droits exigent le proprietaire.
    user: ${POSTGRES_USER:jurika_user}
    password: ${POSTGRES_PASSWORD}
    validate-on-migrate: false
    ignore-migration-patterns: "*:missing,*:future"
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:jurika}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:jurika}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

jurika:
  jwt:
    algorithm: ${JWT_ALGORITHM:RS256}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:/run/secrets/jwt/jwt-public.pem}
    hmac-secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:jurika.ma}
  env: ${JURIKA_ENV:dev}
  release: ${JURIKA_RELEASE:dev}
  # Lot L0 (E16c) : seeder de demonstration INACTIF par defaut ; actif
  # seulement en profil dev (document de profil en fin de fichier).
  demo-seed: false
  # 2026-07-02 — cible de WorkspaceStatusFeignClient (lookup role membre pour le
  # transfert de dossier). En mode local (services lances sur l'hote), auth-service
  # ecoute sur localhost:8081 ; le defaut du @FeignClient (http://auth-service) ne
  # resout qu'a l'interieur du reseau Docker.
  auth:
    internal-url: ${AUTH_INTERNAL_URL:http://localhost:8081}
  observability:
    prometheus:
      password: ${PROMETHEUS_OPS_PASSWORD:}

sentry:
  dsn: ${SENTRY_DSN_JAVA:}
  enabled: ${SENTRY_ENABLED:false}
  environment: ${jurika.env:dev}
  release: ${jurika.release:dev}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  send-default-pii: false
  exception-resolver-order: -2147483647
  in-app-includes:
    - ma.jurika

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,rabbit
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${jurika.env:dev}
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    ma.jurika: INFO

---
# Lot L0 (E16c) : profil dev -- donnees de demonstration (DemoDataSeeder).
spring:
  config:
    activate:
      on-profile: dev
jurika:
  demo-seed: true
